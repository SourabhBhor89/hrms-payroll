spring:
  application:
    name: hrms-backend

  datasource:
    url: jdbc:mysql://localhost:3306/hrms_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:bXktZGV2LWhybXMtc2VjcmV0LWtleS1tdXN0LWJlLWxvbmctZW5vdWdoLTEyMzQ1Njc4OTA=}
    expiration: ${JWT_EXPIRATION:3600000}

  admin:
    email: ${ADMIN_EMAIL:admin@hrms.local}
    password: ${ADMIN_PASSWORD:Admin@12345}