spring:
  application:
    name: hrms-backend

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  cache:
    type: redis
    ttl:
      user-permissions: 30m
      employees: 5m
      employee-profiles: 10m
      leave-types: 24h
      holidays: 24h
      leaves: 5m
    redis:
      time-to-live: 86400000ms
      cache-null-values: false

  datasource:
    url: jdbc:postgresql://db.xpjtliwteybzoczamafk.supabase.co:5432/postgres
    username: postgres
    password: '@Trhhrms@1234'
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false
    clean-on-validation-error: true
    ignore-migration-patterns: "*:*"
  
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:trh072026@gmail.com}  
    password: ${MAIL_PASSWORD:hwmv ralv zbdr yfrx}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/json,application/javascript
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${ACCESS_TOKEN_EXPIRATION:15m}
    refresh-token-idle-timeout: ${REFRESH_TOKEN_IDLE_TIMEOUT:30m}
    activity-update-interval: ${ACTIVITY_UPDATE_INTERVAL:5m}
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}

app:
  admin:
    email: ${ADMIN_EMAIL:admin@hrms.local}
    password: ${ADMIN_PASSWORD:Admin@12345}}
  geofence:
    enabled: ${GEOFENCE_ENABLED:true}
    office-latitude: ${GEOFENCE_OFFICE_LATITUDE:22.7528376043815}
    office-longitude: ${GEOFENCE_OFFICE_LONGITUDE:75.86748476315944}
    allowed-radius-meters: ${GEOFENCE_ALLOWED_RADIUS_METERS:50}
  file-storage:
    location: ${FILE_STORAGE_LOCATION:D:\Spring\TRH Project\HRMS\Documents}

google:
  calendar:
    api-key: ${GOOGLE_CALENDAR_API_KEY:}
    calendar-id: ${GOOGLE_CALENDAR_ID:en.indian#holiday@group.v.calendar.google.com}

  
