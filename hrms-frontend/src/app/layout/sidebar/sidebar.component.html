<aside class="sidebar" [class.collapsed]="isCollapsed()">
  <!-- Brand Logo -->
  <div class="sidebar-header">
    <div class="logo-box">
      <div class="logo-icon">RH</div>
      <div class="logo-text" *ngIf="!isCollapsed()">
        <span class="brand-title">Rapid Hire</span>
        <span class="brand-sub">Enterprise Portal</span>
      </div>
    </div>
    <button class="collapse-btn" (click)="handleHeaderBtnClick()" [title]="isCollapsed() ? 'Expand Sidebar' : 'Collapse Sidebar'">
      <!-- Close (X) icon visible on mobile header -->
      <svg class="close-mobile-icon show-on-mobile" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
      <!-- Normal arrow visible on desktop header -->
      <svg class="desktop-arrow-icon hide-on-mobile" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>
    </button>
  </div>

  <!-- User Active Role Tag -->
  <div class="role-banner" *ngIf="!isCollapsed()">
    <span class="role-dot"></span>
    <span class="role-label">{{ auth.currentRole() }} View</span>
  </div>

  <!-- Navigation Menu -->
  <nav class="nav-menu">
    <div class="menu-group">
      <span class="group-title" *ngIf="!isCollapsed()">CORE MODULES</span>
      <ul class="nav-list">
        <li *ngFor="let item of navItems">
          <a 
            *ngIf="canAccess(item.roles)"
            [routerLink]="item.path" 
            routerLinkActive="active" 
            class="nav-link"
            (click)="onNavLinkClick()"
            [title]="item.title">
            <span class="nav-icon" [innerHTML]="item.icon"></span>
            <span class="nav-text" *ngIf="!isCollapsed()">{{ item.title }}</span>
            <span 
              class="nav-badge" 
              *ngIf="!isCollapsed() && item.badge && item.badge() > 0">
              {{ item.badge() }}
            </span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Sidebar Footer -->
  <div class="sidebar-footer" *ngIf="!isCollapsed()">
    <div class="user-card" *ngIf="auth.currentUser() as user">
      <img [src]="user.avatar" [alt]="user.name" class="user-avatar" />
      <div class="user-info">
        <span class="user-name">{{ user.name }}</span>
        <span class="user-role">{{ user.designation }}</span>
      </div>
    </div>
  </div>
</aside>
