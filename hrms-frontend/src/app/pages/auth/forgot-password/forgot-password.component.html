<div class="auth-page">
  <div class="auth-card glass-card">
    <div class="auth-header">
      <div class="icon-circle">🔐</div>
      <h2>Forgot Password?</h2>
      <p class="sub-text">No worries, enter your registered email below to receive reset instructions.</p>
    </div>

    <div *ngIf="submitted" class="success-alert">
      <span class="icon">✅</span>
      <div>
        <strong>Reset link sent!</strong>
        <p>We have dispatched password reset instructions to <strong>{{ email }}</strong>.</p>
      </div>
    </div>

    <form *ngIf="!submitted" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label class="form-label">Work Email Address</label>
        <input 
          type="email" 
          class="form-input" 
          [(ngModel)]="email" 
          name="email" 
          placeholder="alexandra.vance@hrms.io" 
          required
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        Send Reset Link
      </button>
    </form>

    <div class="auth-footer" *ngIf="submitted">
      <a routerLink="/auth/reset-password" class="btn btn-secondary btn-block">Proceed to Reset Screen</a>
    </div>

    <div class="back-link">
      <a routerLink="/auth/login" class="link-text">← Back to Sign In</a>
    </div>
  </div>
</div>
