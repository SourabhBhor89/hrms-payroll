<div class="auth-page">
  <div class="auth-card glass-card">
    <div class="auth-header">
      <div class="icon-circle">🔑</div>
      <h2>Reset Password</h2>
      <p class="sub-text">Create a new secure password for your NexusHR account.</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input 
          type="password" 
          class="form-input" 
          [(ngModel)]="newPassword" 
          (ngModelChange)="checkStrength()"
          name="newPassword" 
          placeholder="At least 8 characters" 
          required
        />
        <!-- Strength Indicator Bar -->
        <div class="strength-bar" *ngIf="newPassword">
          <div class="strength-progress" [style.width.%]="strengthScore * 33.3" [class]="strengthClass"></div>
        </div>
        <span class="strength-text" *ngIf="newPassword">Strength: {{ strengthLabel }}</span>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input 
          type="password" 
          class="form-input" 
          [(ngModel)]="confirmPassword" 
          name="confirmPassword" 
          placeholder="Re-enter new password" 
          required
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="!isFormValid()">
        Update Password & Login
      </button>
    </form>

    <div class="back-link">
      <a routerLink="/auth/login" class="link-text">← Return to Sign In</a>
    </div>
  </div>
</div>
